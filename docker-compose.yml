services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set (e.g. https://atomicdigital.co.nz) — it ends up in sitemap.xml, robots.txt and canonical tags}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: atomic-cms
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL must be set (e.g. https://atomicdigital.co.nz)}
      # SQLite (default, zero extra services):
      DATABASE_URI: file:./data/atomic-cms.db
      # Postgres (uncomment the `postgres` service below and use this instead):
      # DATABASE_URI: postgres://atomic:atomic@postgres:5432/atomic-cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET must be set}
      CRON_SECRET: ${CRON_SECRET:-}
      SMTP_API_KEY: ${SMTP_API_KEY:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Atomic CMS}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - db_data:/app/data
      - media_data:/app/public/media

  # Optional: uncomment for Postgres instead of the default SQLite file above.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: atomic
  #     POSTGRES_PASSWORD: atomic
  #     POSTGRES_DB: atomic-cms
  #   healthcheck:
  #     test: ['CMD-SHELL', 'pg_isready -U atomic']
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  db_data:
  media_data:
  # postgres_data:
